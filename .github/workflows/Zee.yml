name: Update Zee Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours

jobs:
  update-zee:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # STEP 1: CHECKOUT REPOSITORY
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # STEP 2: ENSURE REQUIRED DIRECTORIES
      # --------------------------------------------------
      - name: Ensure directories exist
        run: |
          mkdir -p sources
          mkdir -p playlist

      # --------------------------------------------------
      # STEP 3: DOWNLOAD SOURCE PLAYLIST (SECRET HIDDEN)
      # --------------------------------------------------
      - name: Download playlist (source hidden)
        env:
          SRC_ZEENEW: ${{ secrets.SRC_ZEENEW }}
        run: |
          wget -q -O sources/zee.m3u "$SRC_ZEENEW"

      # --------------------------------------------------
      # STEP 4: FILTER ZEE CHANNELS (CASE-INSENSITIVE)
      # --------------------------------------------------
      - name: Generate Zee playlist
        run: |
          awk '
          BEGIN { RS="#EXTINF"; ORS="" }
          NR>1 {
            block="#EXTINF"$0
            if (tolower(block) ~ /zee/) print block
          }
          ' sources/zee.m3u > playlist/Z.vxn

      # --------------------------------------------------
      # STEP 5: COMMIT & PUSH ONLY IF CHANGED
      # --------------------------------------------------
      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add playlist/Z.vxn
            git commit -m "Auto-update Zee playlist (Z.vxn)"
            git push
          else
            echo "No changes detected"
          fi
